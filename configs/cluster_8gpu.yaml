# 8-GPU core layout on Perlmutter (2 nodes). NODE1/NODE2, DATA_DIR, LLM_SMALL and
# LLM_LARGE are set by slurm/run_8gpu.sbatch and slurm/env.sh.
#   Node 1: GPU0 all ASR (small x2, large-v3 x2), GPU1-3 one small LLM + one TTS each
#   Node 2: large LLM, tensor-parallel over 4 GPUs
deadline_s: 1.0
max_wait_s: 4.0
asr_snr_threshold_db: 10.0   # set from E1: WER vs. estimated SNR
filler_mode: ${FILLER_MODE}  # bank, or generated once the fine-tuned router is served
max_tokens: 200
request_timeout_s: 60

rag:
  kind: ${RAG_KIND}  # faiss, or none for the RAG-off run (E2)
  index_dir: ${DATA_DIR}/rag_index
  k: 3

services:
  asr_small: ["http://${NODE1}:9001", "http://${NODE1}:9003"]
  asr_large: ["http://${NODE1}:9002", "http://${NODE1}:9004"]
  tts: ["http://${NODE1}:9011", "http://${NODE1}:9012", "http://${NODE1}:9013"]
  llm_small:
    model: ${LLM_SMALL}
    router_model: ${LLM_ROUTER}
    urls: ["http://${NODE1}:8001", "http://${NODE1}:8002", "http://${NODE1}:8003"]
  llm_large:
    model: ${LLM_LARGE}
    urls: ["http://${NODE2}:8100"]

# Placeholder guesses until E1. Replace with:
#   python -m voiceagent.analysis.calibrate logs/run-<id>/always_*.jsonl --out configs/latency_8gpu.json
# and then set   latency: configs/latency_8gpu.json
latency:
  asr_small: {base_s: 0.15, per_inflight_s: 0.01}
  asr_large: {base_s: 0.50, per_inflight_s: 0.03}
  llm_small_first_sentence: {base_s: 0.30, per_inflight_s: 0.01}
  llm_large_first_sentence: {base_s: 0.90, per_inflight_s: 0.03}
  tts: {base_s: 0.15, per_inflight_s: 0.02}
